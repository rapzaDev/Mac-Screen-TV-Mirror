<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MacMirror</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#080d16;color:#f3f5f9;font:24px -apple-system,BlinkMacSystemFont,Arial,sans-serif;width:100%;height:100%;overflow:hidden}video,object{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}#panel{position:absolute;z-index:5;top:8%;left:10%;width:80%;max-height:84%;overflow:auto;background:rgba(15,23,39,.96);border:1px solid #3e5068;padding:40px;border-radius:22px}h1{font-size:48px;margin:0 0 10px}p{line-height:1.5;color:#b8c7de}input,button{font:inherit;border-radius:10px;padding:16px;border:2px solid #63768e;display:inline-block;margin:8px 8px 8px 0}input{width:65%;background:#080d16;color:#fff}button{background:#326be5;color:#fff;cursor:pointer}:focus{outline:5px solid #72dbd2;outline-offset:3px}#status{white-space:pre-wrap}#badge{position:absolute;bottom:24px;left:30px;z-index:4;background:#17243a;padding:12px 20px;border-radius:10px;font-size:20px}#playControls{display:none}.hidden{display:none!important}small{display:block;color:#b8c7de;font-size:19px;line-height:1.6}
</style></head><body>
<video id="video" playsinline></video><object id="avplayer" type="application/avplayer" class="hidden"></object>
<div id="panel"><h1>MacMirror</h1><p id="status" role="status" aria-live="polite">Conecte à transmissão iniciada no Mac.</p><div id="connect"><label for="address" id="addressLabel">Código da sessão exibido no Mac</label><br><input id="address" autocomplete="off" spellcheck="false" aria-label="Código ou endereço do Mac"><button id="start">Conectar</button><small>No navegador, use o código da sessão. No aplicativo Tizen, informe o endereço completo exibido no Mac.</small></div><div id="playControls"><button id="retry">Reproduzir / tentar novamente</button><button id="full">Tela cheia</button><button id="sound">Som: ligado</button><button id="disconnect">Desconectar</button></div><small id="capability"></small></div><div id="badge" class="hidden">Carregando…</div>
<script src="receiver.js"></script></body></html>
